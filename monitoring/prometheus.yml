global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets:
          - api:8000

  - job_name: postgres
    scrape_interval: 10s
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: connect
    scrape_interval: 10s
    static_configs:
      - targets: [connect:9404]

  - job_name: kafka
    scrape_interval: 10s
    static_configs:
      - targets: [kafka:9404]

  - job_name: kafka-consumers
    scrape_interval: 10s
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: clickhouse
    scrape_interval: 10s
    static_configs:
      - targets: [clickhouse:9363]

  - job_name: redis
    scrape_interval: 10s
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: pipeline
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /
    params:
      query: ['SELECT * FROM capstone.pipeline_metrics FORMAT Prometheus']
      max_execution_time: ['3']
    basic_auth:
      username: reader
      password: reader
    static_configs:
      - targets: [clickhouse:8123]
